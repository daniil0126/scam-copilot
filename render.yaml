# Render Blueprint: one Docker web service for the backend. Secrets are filled in the Render dashboard (sync: false), never here.
services:
  - type: web
    name: scam-copilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Shared token the release build of the extension sends in X-Access-Token; any long random string.
      - key: ACCESS_TOKEN
        sync: false
      - key: PROJECT_ID
        value: hjkgljmknkdiikgaflofnlmhbjjjilob
      - key: MONITOR_INTERVAL_SECONDS
        value: "60"
      # Optional: leave LLM_PROVIDER empty to run on the rules alone.
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,google/gemma-4-31b-it:free,cohere/north-mini-code:free
